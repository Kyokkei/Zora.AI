<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zora Hub</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">Zora.AI</p>
        <h1>Community Hub</h1>
      </div>
      <span id="health" class="status">Checking API</span>
    </header>
    <section class="panel">
      <h2>Administration</h2>
      <p>Inspect storage protection and pause publishing without affecting downloads.</p>
      <label>Admin key <input id="adminKey" type="password" autocomplete="off"></label>
      <div class="actions">
        <button id="refreshStorage">Check storage</button>
        <button id="enableUploads" class="secondary">Enable uploads</button>
        <button id="disableUploads" class="danger">Pause uploads</button>
      </div>
      <output id="result" aria-live="polite"></output>
    </section>
  </main>
  <script src="/admin.js" defer></script>
</body>
</html>
